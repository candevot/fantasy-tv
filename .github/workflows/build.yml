name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          # Flutter 3.32.8 = Dart 3.8.1；配合 AGP 8.13 / compileSdk 36
          # 满足 media_kit libmpv 1.1.7 与 Android 16KB 页要求。
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Generate android shell
        run: |
          # android/ 不入库，只提交固定签名的 android/fx-release.jks；
          # 用 cp -r src/. dst/ 合并，避免把 android/ 变成 android/android/。
          flutter create --platforms=android --org com.huanxiang --project-name fantasy_tv _tmp
          mkdir -p android
          cp -r _tmp/android/. ./android/
          rm -rf _tmp
          test -f android/fx-release.jks
      - name: Pin Android toolchain and SDK levels
        run: |
          # compileSdk 36 / targetSdk 36（Android 16）/ minSdk 23；
          # AGP 8.13 + Gradle 8.13 + Kotlin 2.1 + NDK 27，覆盖 16KB 页。
          python3 tools/patch_android_sdk.py
      - name: Patch release signing (fixed keystore)
        run: |
          test -f android/fx-release.jks
          python3 tools/patch_signing.py
          echo '--- signing cert ---'
          keytool -list -v -keystore android/fx-release.jks -storepass fx123456 \
            | grep -E 'Alias name|Valid from|SHA256:'
      - name: Apply app icons
        run: |
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            k=${pair%%:*}; sz=${pair##*:}
            cp assets/icons/ic_launcher-${sz}.png android/app/src/main/res/mipmap-${k}/ic_launcher.png
          done
          ls -l android/app/src/main/res/mipmap-xxxhdpi/
      - name: Patch manifest
        run: |
          python3 - <<'PY'
          import re,io
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application',1)
          s=s.replace('android:label="fantasy_tv"','android:label="幻想影视"')
          if 'usesCleartextTraffic' not in s:
              s=s.replace('<application','<application\n        android:usesCleartextTraffic="true"',1)
          open(p,'w',encoding='utf-8').write(s)
          print(s[:600])
          PY
      - name: Patch edge-to-edge and legacy storage permission
        run: |
          # Flutter 3.32 模板是 `class MainActivity : FlutterActivity()`，
          # 冒号两侧带空格；用独立脚本匹配，避免 patch 静默失效。
          python3 tools/patch_edge_to_edge.py
      - name: Check Android 8+ / 16KB compatibility
        run: |
          python3 tools/check_android_compat.py
      - name: Verify dependency overrides removed
        run: |
          if grep -q '^dependency_overrides:' pubspec.yaml; then
            echo 'dependency_overrides must be removed' >&2
            exit 1
          fi
          grep -E 'media_kit(_video|_libs_video)?:' pubspec.yaml
      - run: flutter pub get
      - run: flutter analyze
      - name: Build release APKs (split per ABI)
        run: |
          echo "versionName=1.0.${{ github.run_number }} versionCode=${{ github.run_number }}"
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}
          ls -lh build/app/outputs/flutter-apk/
      - name: Verify 16KB page alignment (arm64)
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$APK"
          echo "APK_SIZE_BYTES=$(stat -c %s "$APK")"
          rm -rf /tmp/apk16 && mkdir -p /tmp/apk16
          unzip -q -o "$APK" 'lib/arm64-v8a/*.so' -d /tmp/apk16
          for so in /tmp/apk16/lib/arm64-v8a/*.so; do
            ALIGN=$(readelf -lW "$so" | awk '/LOAD/{print $NF; exit}')
            echo "$(basename "$so") LOAD ALIGN=$ALIGN"
          done
          echo '--- libmpv LOAD ---'
          readelf -lW /tmp/apk16/lib/arm64-v8a/libmpv.so | grep LOAD
          MPV_ALIGN=$(readelf -lW /tmp/apk16/lib/arm64-v8a/libmpv.so | awk '/LOAD/{print $NF; exit}')
          echo "libmpv ALIGN=$MPV_ALIGN"
          test "$MPV_ALIGN" = "0x4000"
          # APK 内未压缩 .so 的 zip 偏移也必须是 16KB 对齐。
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          if [ -n "$ZIPALIGN" ] && [ -x "$ZIPALIGN" ]; then
            "$ZIPALIGN" -c -P 16 -v 4 "$APK" | tail -5
          else
            echo 'zipalign not found, skip zip alignment check'
          fi
      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo 'apksigner not found, skip JAR signature check'
          fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: fantasy-tv-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
