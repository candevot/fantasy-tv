name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate android shell
        run: |
          # android/ 不入库，只提交固定签名的 android/fx-release.jks；
          # 用 cp -r src/. dst/ 合并，避免把 android/ 变成 android/android/。
          flutter create --platforms=android --org com.huanxiang --project-name fantasy_tv _tmp
          mkdir -p android
          cp -r _tmp/android/. ./android/
          rm -rf _tmp
          test -f android/fx-release.jks
      - name: Patch release signing (fixed keystore)
        run: |
          test -f android/fx-release.jks
          python3 tools/patch_signing.py
          echo '--- signing cert ---'
          keytool -list -v -keystore android/fx-release.jks -storepass fx123456 \
            | grep -E 'Alias name|Valid from|SHA256:'
      - name: Apply app icons
        run: |
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            k=${pair%%:*}; sz=${pair##*:}
            cp assets/icons/ic_launcher-${sz}.png android/app/src/main/res/mipmap-${k}/ic_launcher.png
          done
          ls -l android/app/src/main/res/mipmap-xxxhdpi/
      - name: Patch manifest
        run: |
          python3 - <<'PY'
          import re,io
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <application',1)
          s=s.replace('android:label="fantasy_tv"','android:label="幻想影视"')
          if 'usesCleartextTraffic' not in s:
              s=s.replace('<application','<application\n        android:usesCleartextTraffic="true"',1)
          open(p,'w',encoding='utf-8').write(s)
          print(s[:600])
          PY
      - name: Patch edge-to-edge
        run: |
          python3 - <<'PY2'
          import re,os
          st='android/app/src/main/res/values/styles.xml'
          s=open(st,encoding='utf-8').read()
          style="""
          <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
              <item name="android:windowBackground">?android:colorBackground</item>
              <item name="android:statusBarColor">@android:color/transparent</item>
              <item name="android:navigationBarColor">@android:color/transparent</item>
              <item name="android:windowDrawsSystemBarBackgrounds">true</item>
              <item name="android:windowLightStatusBar">true</item>
              <item name="android:windowLightNavigationBar">true</item>
              <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              <item name="android:windowTranslucentStatus">false</item>
          </style>
          """
          if 'windowLightNavigationBar' not in s:
              s=re.sub(r'<style name="NormalTheme"[^>]*>.*?</style>', style.strip(), s, flags=re.S)
              open(st,'w',encoding='utf-8').write(s)
          m='android/app/src/main/kotlin/com/huanxiang/fantasy_tv/MainActivity.kt'
          if not os.path.exists(m):
              cands=[os.path.join(r,f) for r,_,fs in os.walk('android/app/src/main') for f in fs if f=='MainActivity.kt']
              m=cands[0] if cands else m
          k=open(m,encoding='utf-8').read()
          if 'setDecorFitsSystemWindows' not in k:
              k=k.replace('import io.flutter.embedding.android.FlutterActivity','import io.flutter.embedding.android.FlutterActivity\nimport androidx.core.view.WindowCompat')
              k=k.replace('class MainActivity: FlutterActivity()','class MainActivity: FlutterActivity() {\n  override fun onCreate(savedInstanceState: android.os.Bundle?) {\n    super.onCreate(savedInstanceState)\n    WindowCompat.setDecorFitsSystemWindows(window, false)\n  }\n}')
              open(m,'w',encoding='utf-8').write(k)
          print(open(st,encoding='utf-8').read()[:300])
          PY2
      - run: flutter pub get
      - run: flutter analyze
      - name: Build release APKs (split per ABI)
        run: |
          echo "versionName=1.0.${{ github.run_number }} versionCode=${{ github.run_number }}"
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}
          ls -lh build/app/outputs/flutter-apk/
      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo 'apksigner not found, skip JAR signature check'
          fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: fantasy-tv-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
