name: build-apk
on:
  push:
    branches: [ main, flutter-upgrade ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    # Release 需要写权限；默认 GITHUB_TOKEN 是只读，创建 Release 会 403。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # better_player_android 的 classes.jar 是 Java 21 编译的
          # （class file version 65.0），JDK 17 读不了。
          java-version: '21'
      # 缓存 Gradle 依赖与构建产物：命中后省 8-10 分钟。
      - uses: actions/cache@v4
        with:
          # 只缓存 Gradle 依赖（约 500MB），不缓存 build/ ——
          # 增量产物跨 commit 复用容易出脏包。
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: subosito/flutter-action@v2
        with:
          # Flutter 3.47.9 = Dart 3.13.7（2026-10-29 stable）。
          # 升到这里是为了能用 better_player / video_player / chewie 这些
          # 要求 Flutter >=3.44 的包 —— 它们底层是 ExoPlayer(Media3)，
          # 也就是腾讯/阿里播放器同款内核，能根治「4K 只播 19 秒」和
          # 「每片都要跳一次 302」这类 libmpv 的 HLS 兼容问题。
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Generate android shell
        run: |
          # android/ 不入库，只提交固定签名的 android/fx-release.jks；
          # 用 cp -r src/. dst/ 合并，避免把 android/ 变成 android/android/。
          flutter create --platforms=android --org com.huanxiang --project-name fantasy_tv _tmp
          mkdir -p android
          cp -r _tmp/android/. ./android/
          rm -rf _tmp
          test -f android/fx-release.jks
      - name: Pin Android toolchain and SDK levels
        run: |
          # compileSdk 36 / targetSdk 36（Android 16）/ minSdk 23；
          # AGP 8.13 + Gradle 8.13 + Kotlin 2.1 + NDK 27，覆盖 16KB 页。
          python3 tools/patch_android_sdk.py
      - name: Patch release signing (fixed keystore)
        run: |
          test -f android/fx-release.jks
          python3 tools/patch_signing.py
          echo '--- signing cert ---'
          keytool -list -v -keystore android/fx-release.jks -storepass fx123456 \
            | grep -E 'Alias name|Valid from|SHA256:'
      - name: Apply app icons
        run: |
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            k=${pair%%:*}; sz=${pair##*:}
            cp assets/icons/ic_launcher-${sz}.png android/app/src/main/res/mipmap-${k}/ic_launcher.png
          done
          ls -l android/app/src/main/res/mipmap-xxxhdpi/
      - name: Patch and validate manifest (XML)
        run: |
          # 不再用字符串 replace：解析 XML、补 INTERNET / 明文流量 / 中文 label，
          # 写回后重新解析校验；缺 INTERNET / cleartext / label / icon 任一项
          # 都会打印 diff 并退出 1。
          python3 tools/patch_manifest.py
      - name: Patch edge-to-edge, storage permission and DLNA multicast lock
        run: |
          # Flutter 3.32 模板是 `class MainActivity : FlutterActivity()`，
          # 冒号两侧带空格；用独立脚本匹配，避免 patch 静默失效。
          # 同时注册 fantasy_tv/cast 通道，SSDP 搜索时申请 MulticastLock。
          python3 tools/patch_edge_to_edge.py
      - name: Inject ExoPlayer (Media3) kernel
        run: |
          # 把 android_src/ 里的 ExoPlayer 桥接插件（ExoPlayerPlugin + SegmentPreloader）
          # 注入 CI 生成的工程，注册到 MainActivity + 加 media3 依赖。
          # 内核就是它：少了这一步 Dart 侧的 fantasy_tv/exo_player 通道没有实现，
          # 一开播就黑屏且没有任何错误。
          python3 tools/patch_exoplayer.py
      - name: Inject jar spider (TVBox type 3) support
        run: |
          # 把 android_src/libs/*.jar（api.jar + okhttp/gson/jsoup/commons-*）
          # 拷进 android/app/libs，加 fileTree 依赖，并在 MainActivity 注册
          # fantasy_tv/spider 通道。必须在 ExoPlayer 注入之后跑：
          # 那一步负责把 android_src/kotlin 下的 .kt 拷进工程。
          python3 tools/patch_jar_spider.py
          ls -l android/app/libs
      - name: Jar permissions gate (Android 14 read-only dex)
        run: |
          # DEX_READONLY（2026-11-15）：Android 14 起 DexClassLoader 只加载只读
          # jar，可写就抛 SecurityException: Writable dex file … is not allowed.
          # 静态断言「chmod 444 在 DexClassLoader 之前、更新/卸载前先改回可写」，
          # 删掉任何一处这里立刻红，不用等真机装包才发现。
          python3 tools/check_jar_readonly.py
          # 真实的 chmod 行为单测：非 root 验证 444 之后 canWrite=false、
          # 覆盖写被拒、makeWritable 后又能写。没有 kotlinc 的环境自动 SKIP。
          bash tools/check_jar_perms.sh
      - name: Check Android 8+ / 16KB compatibility
        run: |
          python3 tools/check_android_compat.py
      - name: Verify dependency overrides removed and media_kit gone
        run: |
          if grep -q '^dependency_overrides:' pubspec.yaml; then
            echo 'dependency_overrides must be removed' >&2
            exit 1
          fi
          # PLAYER_CORE（2026-11-14 二次切换）：内核回到定制 ExoPlayer(Media3)，
          # media_kit(libmpv) 三件套必须不存在 —— 残留会让 APK 多带 4 个架构的
          # libmpv.so（25MB → 62MB），16KB 页对齐还要额外兜。
          if grep -qE '^  media_kit(_video|_libs_video|_libs_android_video)?:' pubspec.yaml; then
            echo 'media_kit 依赖必须移除（ExoPlayer 内核不需要 libmpv）' >&2
            exit 1
          fi
          # Dart 侧也不许再 import media_kit：lib/ 有引用时即使 pubspec 干净，
          # `flutter analyze` 也会因为找不到包而失败，这里提前给出明确报错。
          if grep -rnE "package:media_kit" lib/ ; then
            echo 'lib/ 里仍有 package:media_kit 引用（ExoPlayer 内核不该有）' >&2
            exit 1
          fi
          echo 'media_kit 已完全移除，内核走 android_src/ 的 ExoPlayer 桥'
      - run: flutter pub get
      # JAR_SOURCE_TRUTH（2026-11-21）：jar 源白名单 / 线上配置 / 两行分组的门禁。
      # 现场是「四个源只有咕噜能出线路，橘汁/剧圈/下饭永远灰」+「jar 大类里
      # 显示的其实是采集线路」。这一组用例把三件事钉死：
      #   1. 白名单里只留服务器 jar 实测能出线路的源（咕噜 / 剧圈）；
      #   2. api + ext 从 `hx_all.json` 取，剧圈的 host/package/buildSignature
      #      一个字段都不能丢（丢一个 searchContent 就返回空）；
      #   3. 大类只按 jar 线路 id 分，采集线路一律留在「幻想」，空源不出现。
      - name: jar 源配置 / 白名单 / 两行分组
        run: |
          flutter test test/jar_config_test.dart test/jar_source_toggle_test.dart \
            test/jar_fusion_test.dart test/line_group_prefix_test.dart
      - name: Run flutter analyze (--fatal-infos)
        run: |
          # GATE_STRICT（2026-11-15）：门禁收紧到 `--fatal-infos`。
          # 之前是 `--no-fatal-infos`，info 级问题（未用 import、死代码、
          # 过时 API）可以一路绿着进包；用户要求「analyze --fatal-infos 全绿」，
          # 这里就按 fatal-infos 判定，任何一级问题都让构建红。
          set +e
          flutter analyze --fatal-infos > /tmp/analyze.txt 2>&1
          code=$?
          cat /tmp/analyze.txt
          # 把**每一条**问题（含 info）都变成 GitHub annotation：public 仓库
          # 拿不到 job log 时，也能从 check-runs/annotations 读到文件和原因。
          grep -E " • " /tmp/analyze.txt | head -80 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $code
      - name: Playback recovery regressions
        run: flutter test test/playback_regressions_test.dart

      # AUTO_RESUME / SH4K_RETRY（2026-11-20）：两个现场问题的门禁。
      #
      # ① 「自动切线路之后画面停着不动，要手动点播放」。
      #    根因不是「切完没调 play」，而是**要不要继续播判错了**：
      #    `_bootstrapSource` 一进来就 `_controller?.pause()`（先停旧实例），
      #    ExoPlayer 缓冲中 `isPlaying` 也是 false —— 两者都被当成「用户暂停」，
      #    于是新线路 open 完又立刻 pause 回去（画面停帧）。
      #    所以这里钉两件事：判定只走 `fxShouldPlayAfterSwitch`（用户意图），
      #    换线成功后还有一次起播兜底；反面门禁是「不许再用 isPlaying 判」。
      #
      # ② 「SH4K 有时加载不出来，报线路用不了」。
      #    服务端实测 5 个样本全部 302→200（137/141/139/97 个分片），上游是好的；
      #    客户端这边令牌线路要多走本站 302 + 上游清单 + AES key，冷启动 5~7 秒，
      #    8 秒无进展窗口太紧，一次抖动还冷却 10 分钟。现在钉住：
      #    令牌线路 20 秒窗口、判死前补一次 1.5 秒快速重试、抖动冷却 2 分钟。
      - name: Auto line switch autoplay & SH4K fast retry regressions
        run: |
          set -e
          # ① 用户意图是唯一判据：两个播放页都要有 _userPaused，且都走判定函数。
          grep -q 'bool _userPaused' lib/pages/player_page.dart
          grep -q 'bool _userPaused' lib/pages/fullscreen_page.dart
          grep -q 'fxShouldPlayAfterSwitch(userPaused: _userPaused)' lib/pages/player_page.dart
          grep -q 'fxShouldPlayAfterSwitch(userPaused: _userPaused)' lib/pages/fullscreen_page.dart
          # 用户真的点了暂停/播放，意图要落下来（点播放键那两个入口）。
          grep -q '_userPaused = c.value.isPlaying;' lib/pages/player_page.dart
          grep -q '_userPaused = c.value.isPlaying;' lib/pages/fullscreen_page.dart
          # 自动换线成功后必须自动起播（兜底），并把续播点按新线路重新 arm。
          grep -q '_ensureAutoPlay' lib/pages/player_page.dart
          grep -q 'auto resume line=' lib/pages/player_page.dart
          # 接续位置：最多回退 3 秒。
          grep -q 'fxAutoSwitchMaxRewind' lib/pages/player_page.dart
          grep -q 'fxResumeSecondsAfterSwitch' lib/pages/player_page.dart
          # 反面门禁：换线「要不要继续播」不许再拿 isPlaying 当用户意图。
          if grep -A2 'bool _shouldContinuePlayback' lib/pages/player_page.dart | grep -q 'isPlaying'; then
            echo '换线是否继续播不许用 isPlaying 判定（缓冲中/我们自己 pause 后都是 false）' >&2
            exit 1
          fi
          if grep -A2 'bool _shouldContinuePlayback' lib/pages/fullscreen_page.dart | grep -q 'isPlaying'; then
            echo '全屏页换集是否继续播不许用 isPlaying 判定' >&2
            exit 1
          fi
          # ② SH4K：令牌线路窗口 / 快速重试 / 按原因分档的冷却。
          grep -q 'fxTokenStartupNoProgressWindow' lib/services/auto_resume.dart
          grep -q 'fxStartupNoProgressWindowFor' lib/pages/player_page.dart
          grep -q 'fxStartupNoProgressWindowFor' lib/services/fx_player.dart
          grep -q 'fxFastRetryDelay' lib/pages/player_page.dart
          grep -q 'auto line retry fast' lib/pages/player_page.dart
          grep -q 'fxShouldFastRetry' lib/pages/player_page.dart
          grep -q 'fxCooldownWindowFor' lib/services/line_cooldown.dart
          grep -q "reason: 'stuck_no_progress'" lib/pages/player_page.dart
          # 反面门禁：令牌线路的窗口必须是 15 秒（改小回去就红）。
          grep -q 'fxTokenStartupNoProgressWindow = Duration(seconds: 20)' \
            lib/services/auto_resume.dart
          # 全屏看门狗不许再写一份自己的数字（竖屏 / 全屏 / 内核共用一个）。
          grep -q '_parseLineFirstFrameTimeout =' lib/pages/fullscreen_page.dart
          grep -q 'fxTokenStartupNoProgressWindow;' lib/pages/fullscreen_page.dart
          grep -q 'fxTransientCooldownWindow = Duration(minutes: 2)' \
            lib/services/auto_resume.dart
          flutter test test/auto_resume_test.dart
      # LIVE_EDGE（2026-11-20）：直播页现场问题 —— 用户实测播 CCTV-4K，
      # 顶栏有刷新按钮、左下角有暂停按钮、画面明显落后，原话：
      # 「直播要什么暂停按钮，还有刷新按钮，根本就不对，刷新之后还是当前的，
      #  根本不是跟上跟不上进度，直播不同步」。
      #
      # 口径（用户中途把「落后 8 秒自动追平」否掉了，这里是**改后**的）：
      #   ① 直播没有暂停 / 播放按钮，也没有可拖动的进度条；
      #   ② 刷新 = 重新 prepare + seek 到直播窗口末端前 3 秒（验收：末端 3 秒内），
      #      这是唯一一条追边路径；
      #   ③ 不许任何自动追平、定时位置检查（落后就让它落后）；
      #   ④ 点播（live == false）一个像素都不变：暂停 + 进度条照旧。
      - name: Live mode (no pause, refresh to live edge) regressions
        run: |
          set -e
          # ① 直播页（竖屏）不许有播放 / 暂停按钮。
          if grep -nE 'Icons\.(pause|play_arrow)_rounded' lib/pages/live_detail_page.dart; then
            echo '直播页不许有播放/暂停按钮（用户口径：直播要什么暂停按钮）' >&2
            exit 1
          fi
          # ② 刷新 = 重开 + 落地到直播边缘，回退写死 3 秒 / 下限 2 秒。
          grep -q '_refreshLive' lib/pages/live_detail_page.dart
          grep -q '_openAndLand' lib/pages/live_detail_page.dart
          grep -q '_landOnLiveEdge' lib/pages/live_detail_page.dart
          grep -q 'seekToLiveEdge' lib/pages/live_detail_page.dart
          grep -q 'fxLiveRefreshRewind = Duration(seconds: 3)' lib/services/live_edge.dart
          grep -q 'fxLiveEdgeMinRewind = Duration(seconds: 2)' lib/services/live_edge.dart
          grep -q 'Future<bool> seekToLiveEdge(' lib/services/fx_player.dart
          # ③ 反面门禁：不许把「自动追平 / 定时位置检查」加回来。
          if grep -nE 'fxLiveLagThreshold|fxLiveWatchInterval|Timer\.periodic' \
               lib/services/live_edge.dart lib/pages/live_detail_page.dart; then
            echo '直播不许自动追平 / 定时检查位置：只有刷新才追到边缘' >&2
            exit 1
          fi
          # ④ 全屏直播：暂停入口先短路（点播那段 playOrPause 不许被削掉），
          #    定时关闭到点也不许把直播按停。
          grep -A14 'void _togglePlay() {' lib/pages/fullscreen_page.dart | grep -q 'if (_isLive)'
          grep -q 'playOrPause' lib/pages/fullscreen_page.dart
          grep -A8 'void _fireSleep() {' lib/pages/fullscreen_page.dart | grep -q 'if (!_isLive)'
          # ⑤ 底栏：直播不渲染暂停钮（live == false 时暂停 / 下一集照旧）。
          grep -qF 'if (!live) ...[' lib/widgets/fs_panels.dart
          flutter test test/live_edge_test.dart test/live_mode_test.dart
      # FULLSCREEN_SWITCH（2026-11-21）：直播竖屏 ↔ 全屏来回切卡死。
      #
      # 用户实测：「点全屏 → 卡住；从全屏退回竖屏 → 卡住；黑屏 / 转圈 /
      # 画面不动，要退出重进才恢复」。
      # 根因：原生 ExoPlayerPlugin 只维护一块 videoView，竖屏和全屏各挂一块
      # ExoView 时，输出面被抢走 → 退全屏时全屏那块 dispose 又把输出清掉，
      # 竖屏那块不重建就永远没有输出面。
      # 口径：
      #   ① 全屏期间竖屏必须摘掉自己的画面层（和点播 player_page 同一做法）；
      #   ② 切全屏不许新建播放器 / 不重新 prepare（复用同一个实例，不重缓冲）；
      #   ③ 万一新宿主没接上画面，4 秒自检一次 → 补 play + 落回直播边缘，
      #      不许停在黑屏 / 转圈（只此一条，不是定时追平）；
      #   ④ 点播全屏路径不动。
      - name: Live fullscreen switch regressions
        run: |
          set -e
          # ① 竖屏页用共享口径决定挂不挂画面层。
          grep -q 'fxLiveSurfaceVisible(' lib/pages/live_detail_page.dart
          grep -q 'fullscreenActive: _fullscreenActive' lib/pages/live_detail_page.dart
          grep -q 'bool _fullscreenActive = false;' lib/pages/live_detail_page.dart
          # ② 切全屏路径不许重建播放器 / 重新拉流。
          if sed -n '/Future<void> _openFullscreen() async {/,/^  }$/p' \
               lib/pages/live_detail_page.dart \
               | grep -nE 'FxPlayer\.create|_openAndLand\(|[^_]prepare\('; then
            echo '直播切全屏不许重建播放器 / 重新 prepare（会重新缓冲 = 黑屏）' >&2
            exit 1
          fi
          # ③ 接不上自检 + 落回直播边缘 + 播放，且只允许一次。
          grep -q 'fxLivePictureDead(' lib/pages/live_detail_page.dart
          grep -q 'fxLivePictureDead(' lib/pages/fullscreen_page.dart
          grep -q "_checkSurfaceAfterSwitch(player, phase: 'exit')" lib/pages/live_detail_page.dart
          grep -q 'if (_isLive) unawaited(_checkLiveSurfaceAfterEnter(c));' \
            lib/pages/fullscreen_page.dart
          grep -q 'fxLiveSurfaceCheckDelay = Duration(seconds: 4)' lib/services/live_edge.dart
          # ④ 点播全屏口径原样保留。
          grep -q '!_fullscreenActive' lib/pages/player_page.dart
          flutter test test/live_edge_test.dart test/live_mode_test.dart \
            test/live_fullscreen_switch_test.dart
      # NET_SPEED（2026-11-15）：实时网速。
      #
      # 用户实测「缓冲时转圈下面一直 0 KB/s，从来没变过」：计数器的字节数
      # 一直在涨，坏在速率那一层 —— `PlayerHttp` 把「窗口起点快照」和
      # 「本窗口新增字节」写进同一个 AtomicLong，差值恒 0。现在改成
      # media3 官方的按块回调 + 每秒增量推送。这里钉住四件事，任何一处被
      # 改回去都直接红：
      #   · 播放数据源挂官方 TransferListener（按块回调，不依赖自建 HTTP 层）；
      #   · 官方带宽估算 onBandwidthEstimate 作兜底；
      #   · 原生每秒推一次快照给 Dart（缓冲阶段没有别的事件可推）；
      #   · `[FxNet] bytes=+N/s (X MB/s)` 日志格式还在。
      - name: Live network speed regressions
        run: |
          set -e
          K=android_src/kotlin/com/huanxiang/fantasy_tv
          grep -q 'TransferListener' $K/FxNet.kt
          grep -q 'setTransferListener(FxNet.transferListener)' $K/PlayerHttp.kt
          grep -q 'onBandwidthEstimate' $K/ExoPlayerPlugin.kt
          grep -q 'NET_TICK_MS' $K/ExoPlayerPlugin.kt
          grep -qF '[FxNet] bytes=+' $K/FxNet.kt
          # 反向门禁：窗口快照只允许 bytesPerSec 写。
          if grep -q 'speedWindowBytes.addAndGet' $K/PlayerHttp.kt; then
            echo 'speedWindowBytes 只能由 bytesPerSec 写：计数回调再写它，网速会恒 0' >&2
            exit 1
          fi
          flutter test test/fx_net_speed_test.dart
      # MEDIA_SESSION（2026-11-15）：后台播放从「裸 Service + 手绘通知」升级成
      # media3 的 MediaSessionService + MediaSession，做到和 B 站 / 影视壳一样
      # 的系统媒体卡片（封面 + 片名/第N集 + 进度条 + 上一集下一集，锁屏 / 负一屏 /
      # 耳机线控 / 车机都能控制）。
      #
      # 这里钉死「掉了就会静默退化」的几件事 —— 任何一条缺失，APK 都能正常装、
      # 正常播，只是通知退回普通样式，用户不投诉就发现不了：
      #   · 服务基类是 MediaSessionService，provider 用 media3 默认那套（不自绘布局）；
      #   · 元数据挂在 MediaItem 上（title / artist+albumTitle=第N集·线路名 / artworkUri），
      #     且 session 绑的是**同一个** ExoPlayer 实例（currentPlayer，不新建）；
      #   · 「上一集/下一集」靠 ForwardingPlayer 声明命令并转给 Dart（单集列表天然没有）；
      #   · 播放器 release 之前必须先摘 session（否则 media3 读已释放 player 会崩）；
      #   · 反面：PlaybackService 里不许再出现手绘 Notification.Builder / startForeground。
      # 构建后还会在 APK 里查 dex 与 manifest（verify_apk.py 的 media session 段）。
      - name: MediaSession (system media card) regressions
        run: |
          set -e
          K=android_src/kotlin/com/huanxiang/fantasy_tv
          grep -q 'class PlaybackService : MediaSessionService()' $K/PlaybackService.kt
          grep -q 'MediaSession.Builder' $K/PlaybackService.kt
          grep -q 'DefaultMediaNotificationProvider' $K/PlaybackService.kt
          grep -q 'setMediaNotificationProvider' $K/PlaybackService.kt
          grep -q 'setSessionActivity' $K/PlaybackService.kt
          grep -q 'setArtworkUri' $K/PlaybackService.kt
          grep -q 'setAlbumTitle' $K/PlaybackService.kt
          grep -q 'COMMAND_SEEK_TO_NEXT_MEDIA_ITEM' $K/PlaybackService.kt
          grep -q 'ForwardingPlayer' $K/PlaybackService.kt
          grep -q 'override fun currentPlayer(): Player' $K/ExoPlayerPlugin.kt
          grep -q 'override fun stepEpisode(delta: Int)' $K/ExoPlayerPlugin.kt
          # 集数边界：最后一集不该有「下一集」按钮、第一集不该有「上一集」。
          grep -q 'override fun hasEpisodeStep(delta: Int)' $K/ExoPlayerPlugin.kt
          grep -q 'hasPreviousMediaItem(): Boolean = stepAllowed(-1)' $K/PlaybackService.kt
          grep -q 'PlaybackService.buildMetadata' $K/ExoPlayerPlugin.kt
          grep -q 'PlaybackService.releaseSessionNow' $K/ExoPlayerPlugin.kt
          grep -q 'PlaybackService.syncPlayer' $K/ExoPlayerPlugin.kt
          # 依赖只有 media3-session（media3 的一部分，不额外引库）。
          grep -q 'media3-session' tools/patch_exoplayer.py
          # 清单：media3 的服务 action 必须写进 AndroidManifest。
          grep -q 'androidx.media3.session.MediaSessionService' tools/patch_manifest.py
          # Dart 侧：媒体按键要能落到切集，元数据要跟着 open 走。
          grep -q 'onEpisodeStep' lib/services/fx_player.dart
          grep -q '_handleMediaStep' lib/pages/player_page.dart
          grep -q 'bgTitle' lib/services/exo_player.dart
          grep -q 'warmArtwork' lib/services/exo_player.dart
          grep -q 'fxHasAdjacentEpisode' lib/pages/player_page.dart
          # 反向门禁：不许退回手绘通知（那样锁屏和媒体中心都看不到，也拿不到
          # 上一集下一集）。注意 startForeground 不再禁止 —— BG_GATE 之后
          # 前台由我们自己带类型进（media3 内部那条路是本次闪退的根因），
          # 但必须经 BgSafe.run 包住，由 tools/check_bg_foreground.py 结构校验。
          if grep -q 'Notification.Builder' $K/PlaybackService.kt; then
            echo 'PlaybackService 不许手绘通知：用 media3 的 DefaultMediaNotificationProvider' >&2
            exit 1
          fi
          # BG_GATE：通知照旧由 media3 画，但前台必须由我们接管。
          grep -q 'RecordingNotificationProvider' $K/PlaybackService.kt
          grep -q 'override fun onUpdateNotification(session: MediaSession, startInForegroundRequired: Boolean)' $K/PlaybackService.kt
          grep -q 'super.onUpdateNotification(session, false)' $K/PlaybackService.kt
          grep -q 'FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK' $K/PlaybackService.kt
          grep -q 'PlaybackService.gateServiceStart(' $K/ExoPlayerPlugin.kt
          flutter test test/playback_regressions_test.dart
          # 上一集 / 下一集按钮的边界口径（第一集 / 最后一集 / 集号不连续 / 单片）。
          flutter test test/episode_step_test.dart

      # FFMPEG_AUDIO / AUDIO_BITRATE（2026-11-19）：这一轮两件事的**结构**门禁。
      #
      # 为什么必须有：代码全在 android_src/ 里，`flutter analyze` 看不见；
      # 而「选轨规则错了」连 Gradle 都不会报 —— 它只是静默选错音轨，
      # 用户听到的是「怎么是英语 / 怎么没声音」。所以两件事都钉死：
      #   ① FFmpeg 音轨兜底：依赖坐标、media3 版本配对（nextlib 的版本号
      #      第一段就是 media3 版本）、渲染器工厂、以及**每一条降级路径**
      #      （构造失败 / 播放期解码失败都要能退回系统解码，不许把起播带走）；
      #   ② 音轨按码率选：实现存在 + 纯逻辑单测（tools/check_fx_audio_track.sh），
      #      外加反面断言 —— 不许再把「按编码类型优先 AAC」写回来。
      - name: FFmpeg audio extension & bitrate track selection regressions
        run: |
          set -e
          K=android_src/kotlin/com/huanxiang/fantasy_tv
          # ① 依赖与版本配对（导入即执行 assert：nextlib 版本必须以 media3 版本开头）。
          grep -q "MEDIA3_VERSION = '1.7.1'" tools/patch_exoplayer.py
          grep -q "NEXT_LIB_VERSION = '1.7.1-0.9.0'" tools/patch_exoplayer.py
          grep -q "nextlib-media3ext" tools/patch_exoplayer.py
          python3 -c "import sys; sys.path.insert(0,'tools'); import patch_exoplayer as p; \
            assert p.MEDIA3_VERSION in p.NEXT_LIB_VERSION, 'nextlib 与 media3 版本不配对'; \
            print('version pair ok:', p.MEDIA3_VERSION, '<->', p.NEXT_LIB_VERSION)"
          # ② 渲染器：FFmpeg 音轨渲染器挂在系统渲染器**之后**（兜底），
          #    并且构造/播放期两处失败都有降级。
          grep -q 'FxRenderersFactory(context)' $K/ExoPlayerPlugin.kt
          grep -q 'super.buildAudioRenderers' $K/FxRenderersFactory.kt
          grep -q 'FfmpegAudioRenderer' $K/FxRenderersFactory.kt
          grep -q 'FxAudioExt.disable' $K/FxRenderersFactory.kt
          grep -q 'FxAudioExt.disable' $K/ExoPlayerPlugin.kt
          grep -q 'fun shouldAttach' $K/FxRenderersFactory.kt
          # ③ 选轨：全部音频轨按码率排序 → 用 override 钉死。
          grep -q 'FxAudioTrack.pick' $K/ExoPlayerPlugin.kt
          grep -q 'TrackSelectionOverride' $K/ExoPlayerPlugin.kt
          grep -q 'override fun onTracksChanged' $K/ExoPlayerPlugin.kt
          grep -q 'fun pick(' $K/FxAudioTrack.kt
          grep -q 'audio/eac3' $K/FxAudioTrack.kt
          grep -q 'audio/vnd.dts' $K/FxAudioTrack.kt
          # ④ 反面门禁：不许把「按编码类型优先 AAC」写回来（AAC 一般码率最低）。
          #    只匹配**代码行**（缩进 + builder.setPreferredAudioMimeType），
          #    注释里解释「为什么去掉」的那些文字不算。
          if grep -nE '^[[:space:]]+(builder\.)?setPreferredAudioMimeType' \
               $K/ExoPlayerPlugin.kt; then
            echo '音轨不许再按编码类型优先（AAC 一般码率最低）：改成按码率选' >&2
            exit 1
          fi
          # ⑤ 选轨规则的纯逻辑单测（没有 kotlinc 的 runner 自动 SKIP）。
          bash tools/check_fx_audio_track.sh

      # BG_GATE（2026-11-15）：后台播放「点任意剧就闪退」的**结构性**门禁。
      #
      # 那次闪退不是某句代码写错，而是异常从 media3 库内部（它自己调
      # startForeground）直接落到主线程 —— 我们的 try/catch 根本不在调用栈上。
      # 所以这里的门禁必须能证明「那条路已经不存在」，而不是「文件里有
      # startForeground 字样」：
      #   · 结构校验：每一处 startForeground 都在 BgSafe.run 内、必带
      #     FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK、绝不把 true 交给 media3、
      #     MediaSession 只在主线程建、dispose 里先摘 session 再 release 播放器；
      #   · 纯逻辑单测：Android 13/14/15/17 各档「能不能进前台」的判定；
      #   · kotlinc 全量编译（本机有 jar 时；runner 上没有就 SKIP，最终仍由
      #     Gradle 编译兜底）。
      - name: BG_GATE (background playback crash containment) regressions
        run: |
          set -e
          K=android_src/kotlin/com/huanxiang/fantasy_tv
          python3 tools/check_bg_foreground.py
          bash tools/check_bg_gate.sh
          bash tools/check_kotlin_compile.sh
          # 事故开关必须真的恢复成 true（这是本轮交付物之一）。
          grep -q 'BG_SERVICE_ENABLED = true' $K/ExoPlayerPlugin.kt
          # 崩因分析表必须在文档里（含 media3 那句会 rethrow 的 API）。
          grep -q 'MissingForegroundServiceTypeException' docs/BACKGROUND-PLAYBACK.md
          grep -q 'ForegroundServiceStartNotAllowedException' docs/BACKGROUND-PLAYBACK.md
          grep -q '真机验收' docs/BACKGROUND-PLAYBACK.md

      # PROBE / FLOW_WATCH（2026-11-15）：把「慢网不算失败、真失败才切」钉死。
      #
      # 两个工具都是纯 dart:io（不依赖 Flutter SDK），所以用 dart run 直接跑：
      #   · test_line_probe：三级预检（连接 / 清单 / 首片）对 404 / 非 m3u8 /
      #     0 分片 / 200KB/s 慢线路 / 只探清单 的判定；
      #   · probe_scenarios：打印验收用的真实日志（404 立即切 / 200KB/s 首帧
      #     20 秒不判失败 / 30 秒硬上限到点切），日志格式固定，方便回归对照。
      - name: Line probe & slow-network judgment regressions
        run: |
          dart run tools/test_line_probe.dart
          dart run tools/probe_scenarios.dart
          # ENRICH（2026-11-15）：搜索命中后补线路的规则层（福盈蓝光不补、
          # 集数不硬凑、24 小时缓存键、日志格式）。
          dart run tools/test_line_enrich.dart
      # ASPECT_REAL（2026-11-15）：画面比例几何回归。
      #
      # 用户实测「2.4:1 电影纵向拉长 / 1080×1920 竖屏短剧严重变形 / 4:3 老片
      # 横向拉长」：容器写死 AspectRatio(16/9)，原生又是 MATCH_PARENT 的
      # TextureView（它不认比例，谁摆多大就拉成多大）。这里钉住
      # 「画面框比例 = 视频真实比例」以及 适应 / 填充 / 拉伸 三档的语义。
      - name: Video aspect geometry regressions
        run: flutter test test/fx_video_geometry_test.dart
      # DETAIL_FIX（2026-11-15）：现场两件事的回归 ——
      #   · 点进肥猫（咕噜）那条详情，8 秒整报「该源暂不可用（8 秒无响应）」；
      #     咕噜的 detailContent 要先握手、自身还有 3 次重试 + 500/1000/2000ms
      #     退避（光睡眠 3.5 秒），详情经常落在 9～15 秒。现在「详情超时按来源
      #     区分」：外部源 20 秒、本站 CMS 12 秒；失败还会自动重试一次。
      #   · 外部源结果的第 2、3 条封面空白：vod_pic 是空串 / 源站相对地址，
      #     老逻辑把它补成我们已下线的旧后端 → 图永远回不来。现在按源站根补全，
      #     补不出来就显示「片名首字 + 渐变底」，加载中也是首字。
      # 文案也按来源分开：本站「换条线路试试」，外部源「<源名> 暂时没响应，
      # 换一个源试试」——外部源没有「本站线路」这回事。
      - name: Detail timeout / source text / cover regressions
        run: |
          set -e
          # 结构性断言：详情超时必须是「外部源 20 秒 / 本站 12 秒」两个常量，
          # 任何一处被改回写死 8 秒 / 12 秒都会在这里红。
          grep -q 'externalDetailTimeout = Duration(seconds: 20)' lib/services/cms_bridge.dart
          grep -q 'ownDetailTimeout = Duration(seconds: 12)' lib/services/cms_bridge.dart
          grep -q 'CmsBridge.detailTimeout(widget.id)' lib/pages/detail_page.dart
          # 反面门禁：文案里不许再出现「N 秒无响应」这种把内部超时数字报给
          # 用户的写法（现场那句「该源暂不可用（8 秒无响应）」就是这么来的）。
          if grep -F -- '秒无响应）' lib/services/cms_bridge.dart; then
            echo '文案不许再写死「N 秒无响应」' >&2
            exit 1
          fi
          flutter test test/detail_source_fix_test.dart
      # JAR_RESTORE（2026-11-21）：jar 源接入层恢复后的回归。
      #
      # 这一层只管**搜索 + 播放解析**：首页 / 分类 / 排行榜仍然只用自有片源。
      #   · 白名单（kEnabledJarSources）里的四个源必须还在、类名必须对得上；
      #   · 融合口径：我们有的片合并线路（`咕噜·4K`），没有的片新增卡片；
      #   · 两行线路：大类 = 幻想 + **真的返回了线路**的 jar 源，子线路不带前缀，
      #     自有线路恒排 jar 线路前面；
      #   · 播放实时解析：走 playerContent，不读库里存的地址；
      #   · 反面门禁：不许恢复 TVBox 配置导入 / 启动自动安装。
      - name: jar 源（融合 / 两行线路）regressions
        run: |
          set -e
          grep -q "const List<String> kEnabledJarSources" lib/services/jar_sources.dart
          # 白名单 = 服务器 jar 实测**真能出线路**的两个源：
          #   咕噜 csp_Gulu（八仙 15 条 / 济公传 4 条）、剧圈 csp_App99。
          grep -q "kEnabledJarSources = <String>\['咕噜', '剧圈'\]" lib/services/jar_sources.dart
          grep -q 'csp_Gulu' lib/services/jar_sources.dart
          grep -q 'csp_App99' lib/services/jar_sources.dart
          # 反面门禁：实测不可用的源不许回到白名单那一行
          # （橘汁 csp_AppDrama 的 searchContent 恒空；下饭 csp_JuXiaFan 25～49 秒
          #   回空列表）。它们还留在文件注释里说明原因，所以只查白名单那一行。
          whitelist=$(grep -n "const List<String> kEnabledJarSources" lib/services/jar_sources.dart | cut -d: -f1 | xargs -I{} sed -n "{}p" lib/services/jar_sources.dart)
          echo "白名单：$whitelist"
          if echo "$whitelist" | grep -qE "橘汁|下饭|AppDrama|JuXiaFan"; then
            echo '橘汁 / 下饭 实测拿不到数据，不许回白名单' >&2
            exit 1
          fi
          # 通道契约不许改（方法名 / 参数名保持原样）
          grep -q "MethodChannel('fantasy_tv/spider')" lib/services/jar_spider.dart
          # 反面门禁：TVBox 配置导入不回来
          if grep -q 'importTvBox' lib/ -r; then
            echo '不许恢复 TVBox 配置导入' >&2
            exit 1
          fi
          # 失败时把 flutter test 的真实输出变成 GitHub annotation：
          # public 仓库拿不到 job log，只能靠 annotation 读失败原因。
          for t in test/jar_fusion_test.dart test/jar_source_toggle_test.dart \
                   test/jar_plugin_test.dart test/tvbox_crypto_test.dart \
                   test/search_group_test.dart test/search_group_pinned_test.dart; do
            if ! flutter test "$t" > /tmp/t.txt 2>&1; then
              echo "::error::$t 失败"
              grep -E "Expected:|Actual:|Which:|^  [a-z_]+_test\.dart|Test failed|Error:" /tmp/t.txt \
                | head -20 | while IFS= read -r line; do echo "::error::$line"; done
              tail -60 /tmp/t.txt
              exit 1
            fi
          done
          # ---- JAR_BOOT（2026-11-21 用户实测）：首次进 App 自动装 jar ------
          #
          # 现场：装完 App 打开详情页，四个 jar 源 chips 全灰 —— 根因是
          # spider.jar 没装（jar 通道不可用 → 源没有线路 → 置灰）。
          # 现在的口径：**冷启动自动装**（后台静默 + md5 校验 + 失败不阻断），
          # 装好之后四个源立刻可用；没装时搜索 / 详情一条 jar 请求都不发。
          test -f lib/services/app_settings.dart

          # ① 默认开关必须是「开」，默认地址 / md5 指向自建服务器那份。
          grep -q "defaultJarAutoInstall = true" lib/services/app_settings.dart
          grep -q "http://125.94.244.87/spider.jar" lib/services/app_settings.dart
          grep -q "cbe016eb3cb002ae62058604843f5106" lib/services/app_settings.dart
          grep -q "?? defaultJarAutoInstall" lib/services/app_settings.dart

          # ② 启动流程真的调了自动安装，而且**不许 await**（不挡首屏）。
          grep -q "JarPluginManager.instance.bootSilently()" lib/main.dart
          if grep -q "await JarPluginManager.instance.bootSilently" lib/main.dart; then
            echo '启动装 jar 不许 await（挡首屏）' >&2
            exit 1
          fi

          # ③ 自动装带日志：真机 `adb logcat | grep JarBoot` 能看出装没装。
          grep -q "const String fxJarBootTag = 'JarBoot'" lib/services/jar_log.dart
          grep -q "tag: fxJarBootTag" lib/services/jar_plugin.dart
          grep -q "启动检查 auto=" lib/services/jar_plugin.dart
          grep -q "结果 phase=" lib/services/jar_plugin.dart

          # ④ jar 没装时搜索 / 详情不发请求（不白等），并提示「jar 未就绪」。
          grep -q 'final jarSources = hub.jarReady ? plan.external : const <KSource>\[\];' lib/services/cms_bridge.dart
          grep -q 'if (!hub.jarReady) return 0;' lib/services/cms_bridge.dart
          grep -q 'if (!hub.jarReady) return const <LineInfo>\[\];' lib/services/cms_bridge.dart
          grep -q 'jar 未就绪' lib/services/source_hub.dart
          grep -q '_jarNoticeBar' lib/pages/search_page.dart
          grep -q '_jarNotReadyHint' lib/pages/detail_page.dart

          # ⑤ 装好之后详情页会「现场补命中」+ 重合并，chips 不再置灰。
          grep -q 'static Future<int> fillJarHitsFor' lib/services/cms_bridge.dart
          grep -q 'fillHits: true' lib/pages/detail_page.dart
          grep -q '_onHubChanged' lib/pages/search_page.dart
          grep -q '_onHubChanged' lib/pages/detail_page.dart

          # ⑥ 两行线路的**第一行大类按线路名前缀判**（不再按数据来源）：
          #    库里裸名字 `咕噜` 必须进咕噜大类，自有的 `量子` 仍在幻想大类。
          grep -q 'String fxLineGroupLabelOfName(String name)' lib/services/jar_sources.dart
          grep -q 'if (raw.startsWith(label) || plain.startsWith(label)) return label;' lib/services/jar_sources.dart
          # 反面门禁：不许再只认带分隔符的 `$label·`（那正是本次 bug 的根因）。
          if grep -q "name.startsWith('\$label·')" lib/services/jar_sources.dart; then
            echo '分组不许再只认「前缀+分隔符」（裸名字咕噜会漏到幻想大类）' >&2
            exit 1
          fi
          # ⑦ 片源管理里的三档状态文案。
          grep -q "FxJarSourceState.jarMissing => 'jar 未安装'" lib/services/jar_sources.dart
          grep -q "FxJarSourceState.disabled => '已停用'" lib/services/jar_sources.dart
          grep -q "FxJarSourceState.available => '可用'" lib/services/jar_sources.dart
          flutter test test/line_group_prefix_test.dart test/jar_autoboot_test.dart

          # 服务器上的 spider.jar 必须还在、md5 必须和默认值一致。
          # 非阻塞：服务器偶发抖动不该让整个构建红掉，但日志里要能看见。
          python3 tools/check_spider_url.py || true
      # PROTOCOL_FACE（2026-11-15 · 移植阶段 1）：TVBox 配置协议面。
      #
      # 这一段钉住「壳的配置字段被丢弃」导致的整类问题 —— 它们不会报错，
      # 只会让某个源「看起来能填、实际走错分支」：
      #   · `parses` / `flags` / `ads` / `hosts` / `rules` / `doh` / `spider`
      #     七个顶层键必须解析出来（少了就是解析器注册表整个不存在）；
      #   · `sites` 的 12 个字段必须解析出来（少了 timeout 就会让慢源被全局
      #     12 秒误杀，少了 header 就会让要 Referer 的源 403）；
      #   · `json:` / `parse:` 寻址、`ac=` + `ext` 长度决定 GET/POST、
      #     `rules` 嗅探、源级失败冷却，各自有单测。
      - name: Protocol face (config / parse / rules / ledger) regressions
        run: |
          set -e
          # 通道契约只增不改：新增 setDnsProfile 之外，既有方法一个都不许动。
          for m in init open play pause seek rate mirror prefetchSegment \
                   supportsHevc state preloadNext cancelPreload release \
                   bgStart bgStop warmArtwork bgBattery bgBatteryIgnoring \
                   bgConsumeHint; do
            grep -q "\"$m\" ->" android_src/kotlin/com/huanxiang/fantasy_tv/ExoPlayerPlugin.kt
          done
          grep -q '"setDnsProfile" ->' android_src/kotlin/com/huanxiang/fantasy_tv/ExoPlayerPlugin.kt
          grep -q 'fun applyProfile' android_src/kotlin/com/huanxiang/fantasy_tv/FxDns.kt
          # 快照键（Dart 侧静默退化的重灾区）继续存在。
          for k in bgTitle bgEp bgLine bgCover firstFrameRendered preloadedMs \
                   retryResolveToken fatalError; do
            grep -rq "$k" lib/services/exo_player.dart lib/services/fx_player.dart
          done
          flutter test test/tvbox_config_test.dart
          flutter test test/parse_registry_test.dart
          flutter test test/cms_request_test.dart
          flutter test test/sniff_rules_test.dart
          flutter test test/source_failure_test.dart
          # 字段从配置落到 KSource / 站点画像这一段（timeout / header / playUrl）。
          flutter test test/source_protocol_fields_test.dart
      # LINES_ALL / HOT_ORDER（2026-11-15）：多线路解析 + 热播排序映射的回归。
      # 用真实接口数据（test/fixtures/detail_romelia.json，四条线路）钉住
      # 「详情页只显示一条线路」这个用户实测问题不再回来。
      - name: Line parsing & hot order regressions
        run: |
          flutter test test/cms_lines_test.dart
          flutter test test/cms_source_test.dart
          # DEAD_LINE / LINE_ALIGN（2026-11-15）：「幻想蓝光（FY-PAN1）」
          # 整批失效 → 用户点到这条线路 App 直接闪退。这里钉住两件事：
          # 死线路在解析层就被跳过；线路名/地址错位、空地址段进来时只少一条
          # 线路，绝不把空 URL 或死令牌交给播放器。
          flutter test test/dead_line_test.dart
      # IQ_CODEC（2026-11-15）：爱奇艺线路按**设备硬解能力**选编码。
      # 能硬解 HEVC 的机器要 1080P HEVC（地址追加 hevc=1），不能的才退
      # 896×504 H.264；HEVC 起播失败（解码错误 / 首帧 8 秒）自动降级一次。
      # 这里钉三件事：地址改写规则、候选序列、以及原生通道契约还在
      # （supportsHevc 方法 / X-Iq-Codec 响应头）—— 少了任何一处，用户
      # 看到的不是报错，而是「画质莫名其妙变糊」。
      - name: iqiyi codec (HEVC/AVC) regressions
        run: |
          set -e
          grep -q 'fun supportsHevcHardware' android_src/kotlin/com/huanxiang/fantasy_tv/ExoPlayerPlugin.kt
          grep -q '"supportsHevc" ->' android_src/kotlin/com/huanxiang/fantasy_tv/ExoPlayerPlugin.kt
          grep -q 'video/hevc' android_src/kotlin/com/huanxiang/fantasy_tv/ExoPlayerPlugin.kt
          grep -q 'X-Iq-Codec' android_src/kotlin/com/huanxiang/fantasy_tv/ManifestProxy.kt
          grep -q 'iqiyi downgrade hevc->avc' lib/services/iqiyi_codec.dart
          flutter test test/iqiyi_codec_test.dart
      # SEARCH_RANK：搜索结果按「实际分辨率」跨源全局排序的回归。
      - name: Search rank regressions
        run: flutter test test/search_rank_test.dart
      # SEARCH_RELEVANCE / DEDUPE_LINES / SIDE_PANEL / FS_ICON_SPEC：
      # 这一轮现场问题的回归，五件事各自钉死：
      #   · 搜「济公传」时不能出现「背着善宰跑」这类无关片
      #     （外部接口不保证按关键词搜，客户端必须有相关性闸门）；
      #   · 没有任何可用线路的空壳记录在搜索/列表阶段就丢掉；同名记录去重保留
      #     线路多的那条（搜索里那条点进去必失败的重复记录就是这样没的）；
      #   · SIDE_PANEL（2026-11-20）：播放设置 / 选集两个面板从「底部弹层」
      #     改成「右侧竖排面板」—— 宽 = 屏宽 42%、不超过半屏、放得下时最少
      #     300dp，高 = 屏高 − 上下各 12dp，只左两角圆角，黑 72% + blur 18，
      #     右上角 × 与外点关闭；播放设置 4 列等宽图标 + 开关 / 箭头行全部保留；
      #     选集 5 列正方形网格、当前集紫色实底、长剧集自动定位。
      #     旧的「面板不盖满屏（≤55%/40% 屏高）」断言随实现作废（PANEL_CAP）。
      #   · 全屏控件只有一套规格（底 30 / 图标 19.5 / tint .13 / 热区 44）。
      - name: Search relevance & panel/control spec regressions
        run: |
          flutter test test/search_relevance_test.dart
          flutter test test/search_dedupe_test.dart
          flutter test test/player_more_panel_test.dart
          flutter test test/fs_episode_panel_test.dart
          flutter test test/fs_controls_spec_test.dart
      # SOURCE_LABEL（2026-11-15）：搜索结果卡片的「来源」标注回归。
      #
      # 用户实测同一部片一会儿「来源：云端」一会儿「来源：幻想」。规则是
      # 「我们自己的源只叫幻想 / 肥猫源用自己名字 / 自加源用自己名字」，
      # 而且判定只看 api，不看源的名字、也不看它是不是云端下发。
      - name: Source label regressions
        run: flutter test test/source_label_test.dart
      # FX_FALLBACK（2026-11-15）：本片线路全失败后的三段降级
      # （同源其他版本 → 跨源同名）。跳错片子比播不出来更糟，所以
      # 片名归一化 / 年份上限 / 解说预告排除 / 集号对齐 / 进度接续
      # 全部逐条钉住。
      - name: Playback source fallback regressions
        run: |
          # 规则层（纯函数）与决策层（注入假源）分开跑：
          #   · fallback_match：片名归一化 / 年份上限 / 解说预告排除 /
          #     集号对齐 / 进度接续 / 日志格式；
          #   · source_fallback：走哪一段、排除自己、集数不够不换、
          #     只切一次、triedSources 生效、没有外部源时如实上报。
          flutter test test/fallback_match_test.dart
          flutter test test/source_fallback_test.dart
          # LINE_COOLDOWN：失败线路 10 分钟不再试、本次播放内沉底、
          # 下次排序同分辨率下排后面、重试/播成功清记录。
          flutter test test/line_cooldown_test.dart
          # KNOWN_BAD（2026-11-15）：死线路 / 冷却中 / 预检判坏的线路必须沉到
          # 最后，并且**不被选成详情页默认线路**。用户实测的「默认还是幻想
          # 蓝光 → 直接闪退」就是这条规则没生效。
          flutter test test/line_rank_test.dart
          dart run tools/test_fallback_match.dart
      # TOGETHER_WS（2026-11-15）：一起看的 ws 地址推导回归
      # （旧机 47.96.0.112 已下线、尾斜杠 / https 不能拼错）。
      - name: together endpoint regressions
        run: flutter test test/together_endpoint_test.dart
      # TOGETHER_OPEN_CONTROL（2026-11-15）：一起看去掉房主权限、房间绑定
      # 「源 + 片 + 线路列表」的协议回归。
      #
      # 钉住的事：room_state 里的 source/lines/leaderId/by 都得解析出来；
      # 房间线路按名字认（大小写无关）；操作广播能拼成「小明 换了线路 → 幻想4K」；
      # 老服务端（没有 lines / leaderId）仍然能进房间，不因为缺字段就拒人。
      - name: together open-control regressions
        run: |
          # 纯模型层：room_state 的源 / 片 / 线路 / leaderId / op 解析。
          flutter test test/together_open_control_test.dart
          # 客户端报文层：起一个本地假 ws 服务器，验证建房带「源 + 片 + 线路」、
          # switchLine 带当前进度、switchTitle 带新线路列表、心跳带 quiet。
          flutter test test/together_client_ws_test.dart
      # LIVE_TOGETHER（2026-11-20）：一起看**直播房**的同步口径。
      #
      # 用户第三次澄清（最终口径，之前作废）：
      #   「一方点了刷新之后，两边才会同时刷新，跟随电视直播的进度，
      #     我是说双方不会同步。正常看的话」
      #
      # 钉住三件事，回退了必然复现现场：
      #   ① 频道同步：进房同一个台，谁切台双方一起切（只广播 channelId + 线路）；
      #   ② 正常观看不同步：直播房**不广播** seek / 位置 / 暂停 / 播放 / 切集，
      #      各自落后多少算多少（电视直播本来就有延迟）；
      #   ③ 刷新同步：任何一方点刷新，双方都落到直播边缘前 3 秒
      #      （唯一会广播的位置类动作），自己的回声不重复刷。
      #
      # 顺带锁住：直播房没有「一起暂停」按钮（widget 断言）、
      # 房间模式标记 mode = vod | live 能从 create / room_state 读出来。
      - name: together live-mode regressions
        run: |
          set -e
          # 口径常量必须在：白名单只有 switchChannel / liveRefresh。
          grep -q "togetherLiveChannelAction = 'switchChannel'" lib/widgets/together_live.dart
          grep -q "togetherLiveRefreshAction = 'liveRefresh'" lib/widgets/together_live.dart
          grep -q 'togetherLiveShowsTogetherPause = false' lib/widgets/together_live.dart
          # 直播房不许再发 play / pause 的权威状态（老 _sendLiveState 已删除）。
          if grep -q '_sendLiveState' lib/pages/together_page.dart; then
            echo '直播房又出现了 play/pause 广播（_sendLiveState）'; exit 1
          fi
          # 刷新落点必须走统一口径（窗口末端前 3 秒），不许另写 magic number。
          grep -q 'fxLiveRefreshRewind' lib/pages/together_page.dart
          grep -q 'togetherLiveRefreshTarget' lib/widgets/together_live.dart
          flutter test test/together_live_mode_test.dart
      # TOGETHER_SYNC_POLICY（2026-11-15）：一起看的同步验收口径。
      #
      # 钉住用户给的数字：偏差 ±2 秒内只微调 ±0.05x 倍速、超过 2 秒才硬 seek；
      # 心跳 1 秒一次；本地操作 700ms 乐观主导权（到点必须能退回跟随）；
      # 操作流水文案「小明 …」/ 自己「你 …」且同动作 1 秒内合并。
      - name: together sync policy regressions
        run: flutter test test/together_sync_policy_test.dart
      # TOGETHER_FOUR_FIX（2026-11-16）：用户实测四条一起看问题。
      #
      # 这一组是**现场症状**的门禁，不是「代码风格」门禁 —— 每一条都对应
      # 一次用户截图报障，回退了必然复现：
      #   ① 「你 开始播放」连刷：同人同动作 3 秒窗口 + 连续重复丢弃 +
      #      非用户动作白名单；心跳 / 进度 / resync 绝不生成操作提示；
      #   ② 横屏全屏聊天不自动滚到底：必须在布局前取样「是否贴底」，
      #      且 ListView 的 maxScrollExtent 要连追几帧才落到真正的底；
      #   ③ 顶栏按钮小得离谱：热区 ≥44dp、字号 ≥12sp，放不下进「更多」，
      #      组件树里不许再出现 FittedBox 缩放；
      #   ④ 房间信息卡片占一整块：压成一行「片名 · 第N集 · N人」。
      - name: together four fixes (op dedupe / chat autoscroll / top bar 44 / info one-line)
        run: |
          set -e
          # ② 自动贴底的实现必须还在：布局前取样 + 多帧追底 + 视口变化跟随。
          grep -q '_isNearBottom()' lib/widgets/together_chat.dart
          grep -q '_followMaxAttempts' lib/widgets/together_chat.dart
          grep -q '_lastViewport' lib/widgets/together_chat.dart
          # ① 去重口径：3 秒窗口 + 连续重复丢弃 + 用户动作白名单。
          grep -q 'togetherOpDedupeWindow = Duration(seconds: 3)' lib/widgets/together_ui.dart
          grep -q 'togetherShouldSkipOp' lib/widgets/together_ui.dart
          grep -q 'togetherIsUserOp' lib/widgets/together_ui.dart
          # ① 内部上报（建房 / resync）不许再带 op。
          grep -q '_reportInternalState' lib/pages/together_page.dart
          grep -q '_applyingRemote' lib/pages/together_page.dart
          # ③ 顶栏：44dp / 12sp 常量，且房间页与全屏都不再缩放动作区。
          grep -q 'kTogetherActionHit = 44' lib/widgets/together_top_actions.dart
          grep -q 'kTogetherActionFont = 12.5' lib/widgets/together_top_actions.dart
          # ④ 信息条压成一行。
          grep -qF '人' lib/widgets/together_room.dart
          grep -qF "· " lib/widgets/together_room.dart
          flutter test test/together_four_fixes_test.dart
          flutter test test/together_top_actions_test.dart
          # 服务端闸门：非用户动作不播 + 同人同动作 3 秒内只播一条。
          # （源码取仓库里的 together_ws_new.js 副本，见 tools/ 下的说明）
          if [ -f tools/together_ws_new.js ]; then
            TOGETHER_WS_SRC=tools/together_ws_new.js node tools/test_together_op_dedupe.js
          else
            echo 'SKIP 服务端副本不在仓库里，跳过（客户端闸门已覆盖同一口径）'
          fi
      # FS_MATCH_MAIN（2026-11-16）：一起看的全屏 = 主播放的全屏。
      #
      # 用户原话：「一起看里面不需要投屏，一起看的全屏里面也不需要多余设置，
      # 和自己在线看是一样的，要想还原就切竖屏，要想操作就切竖屏」。
      #
      # 现场是一排塞满（返回/片名·第N集/网速/分辨率/时钟/投屏/换源/换剧/
      # 1人/邀请），「邀请」已经贴边溢出。现在钉死：
      #   · 顶栏 action 集合 = 主播放那一套 + 人数（只读），多一个都不许；
      #   · 投屏 / 换源 / 换剧 / 邀请 / 退出房间 一律不在全屏出现；
      #   · 投屏在一起看里整颗移除（竖屏也没有），CastService 本身保留。
      - name: together fullscreen matches main playback
        run: |
          set -e
          # 全屏顶栏用的就是主播放那套 FsTopBar，投屏整颗关掉。
          grep -q 'TogetherFullscreenTopBar' lib/widgets/together_fullscreen.dart
          grep -q 'showCast: false' lib/widgets/together_fullscreen.dart
          # 房间动作不许回到全屏顶栏。
          ! grep -q "label: '邀请'" lib/widgets/together_fullscreen.dart
          ! grep -q "label: '换源'" lib/widgets/together_fullscreen.dart
          ! grep -q "label: '换剧'" lib/widgets/together_fullscreen.dart
          ! grep -q 'TogetherTopActionBar' lib/widgets/together_fullscreen.dart
          # 一起看整体没有投屏入口（竖屏也没有）；投屏服务本身必须还在。
          ! grep -q 'onCast' lib/widgets/together_fullscreen.dart
          ! grep -q 'onCast' lib/widgets/together_room.dart
          ! grep -q 'CastService' lib/pages/together_page.dart
          test -f lib/services/cast_service.dart
          test -f lib/widgets/cast_sheet.dart
          # 主播放不能被牵连。
          grep -q 'onCast: () => unawaited(_openCastSheet())' lib/pages/fullscreen_page.dart
          flutter test test/together_fullscreen_topbar_test.dart
      # TOGETHER_VOD_REGRESSION（2026-11-21）：修「直播竖屏 ↔ 全屏卡死」时
      # 顺带把**点播一起看**的页面接线整条过一遍 —— 生产改动只在直播切换
      # 路径上，这一组门禁负责证明点播那半边没被碰坏：
      #   ① 建房 / 加入：createRoom / joinRoom 之后必须 connect；
      #   ② 暂停 / 继续 / 拖动 / 切集：上报 op=pause|play|seek|episode，
      #      成员按 mediaChanged 重载 + _followPlayIntent / _staggerHardSeek；
      #   ③ 切线路：按线路名广播（sendSwitchLine），成员映射本地同名线路；
      #   ④ 退出：leave + 释放播放器 + 清房号（迟到的重连不会把人塞回房间）；
      #   ⑤ 全屏：主画面 + 人数 + 可发言聊天三件都在，且只有一块画面层；
      #   ⑥ 直播房：只同频道 / 刷新，不同步播放态。
      - name: together vod regression (create / sync / line / exit / fullscreen)
        run: |
          set -e
          grep -q 'mediaChanged: changedVideo || changedEp || changedLine' lib/pages/together_page.dart
          grep -q "_client.sendSwitchLine(name, position: position, playing: playing, ep: _ep);" \
            lib/pages/together_page.dart
          grep -q 'if (!fromPeer) _client.sendLiveRefresh();' lib/pages/together_page.dart
          grep -q "code = '';" lib/widgets/together_client.dart
          flutter test test/together_vod_regression_test.dart
      - name: Build release APKs (split per ABI)
        run: |
          echo "versionName=1.0.${{ github.run_number }} versionCode=${{ github.run_number }}"
          # SPEED（2026-11-12）：只出 arm64。
          #
          # 必须同时用 --split-per-abi 和 --target-platform：
          #   · 只写 --target-platform=android-arm64 → 生成 fat APK
          #     （libmpv 时代的教训：4 个架构的 .so 全塞进去，25MB → 62MB）
          #   · 只写 --split-per-abi → 出 3 个包（arm64/v7a/x86_64）
          #   · 两个一起用 → 只出 arm64 一个包，且只含 arm64 的 .so
          flutter build apk --release \
            --target-platform=android-arm64 \
            --split-per-abi \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}
          # APK 改名成「幻想影视-v<版本>.apk」，装到手机上一眼能看出是哪个版本
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "build/app/outputs/flutter-apk/幻想影视-v1.0.${{ github.run_number }}.apk"
          ls -lh build/app/outputs/flutter-apk/
      - name: Verify release APK (comprehensive gate)
        run: |
          # 权限 / 明文流量 / label / icon / MaterialIcons 字体 / logo.png /
          # libapp + libflutter + libmpv / libmpv 4 段 LOAD 0x4000 /
          # META-INF + apksigner / zipalign / 体积 / sha256，任一不过即失败。
          APK=$(ls build/app/outputs/flutter-apk/幻想影视-v*.apk | head -1)
          echo "verify: $APK"
          python3 tools/verify_apk.py "$APK"
      # artifact 配额满了会失败（Failed to CreateArtifact: quota hit），
      # 所以上传改成「允许失败」，后面再用 Release 兜底。
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: 幻想影视-v1.0.${{ github.run_number }}
          path: build/app/outputs/flutter-apk/幻想影视-v*.apk
      # Release 通道：不占 artifact 配额，直接挂到 tag 上，可长期下载。
      - name: Publish APK to Release
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls build/app/outputs/flutter-apk/幻想影视-v*.apk | head -1)
          test -f "$APK" || { echo 'no apk'; exit 1; }
          # gh release 的 "file#name" 语法里 #name 不能带中文/特殊字符，
          # 否则会被截成「-v1.0.226.apk」。这里统一用英文 asset 名，
          # 中文名只保留在 Release 标题里。
          NAME="FantasyTV-v1.0.${{ github.run_number }}-arm64.apk"
          cp "$APK" "/tmp/$NAME"
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" "/tmp/$NAME" \
            --title "幻想影视 $TAG" \
            --notes "构建 #${{ github.run_number }} · $(date '+%Y-%m-%d %H:%M')" || true
