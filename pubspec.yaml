name: fantasy_tv
description: 幻想影视 - 纯净追剧
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  # media_kit（libmpv）播放内核；1.3.0 / 1.0.6 是仍兼容 Flutter 3.24
  # Android 工具链（AGP 8.1 / Gradle 8.3 / compileSdk 34）的最新版本。
  media_kit: ^1.2.6
  media_kit_video: 1.3.0
  media_kit_libs_video: 1.0.6
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.2
  # 直播详情「分享」调系统分享面板；10.x 兼容 Flutter 3.24 / compileSdk 34。
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  image: ^4.2.0
  path_provider: ^2.1.4
  # 读取 Android 真实 versionName / versionCode（设置页、关于页、检查更新）。
  package_info_plus: ^8.3.1
  # 播放页上下滑手势：亮度 / 音量。两者都是 media_kit_video 的传递依赖，
  # 这里固定成同一版本，避免 CI 解析出需要更高 compileSdk 的新版。
  screen_brightness_platform_interface: ^2.1.2
  volume_controller: ^3.4.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
# 传递依赖的新版本已要求 compileSdk 35/36 或更新的 AGP，Flutter 3.24.5 的
# android 模板（compileSdk 34 / AGP 8.1 / Gradle 8.3）会直接构建失败，锁回可用版本。
dependency_overrides:
  media_kit_libs_android_video: 1.3.7
  screen_brightness_android: 2.1.2
  wakelock_plus: 1.2.8
flutter:
  uses-material-design: true
  assets:
    - assets/
