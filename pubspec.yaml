name: fantasy_tv
description: 幻想影视 - 纯净追剧
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.2.0
  # media_kit（libmpv）播放内核；libs_video 1.0.7 起自带 16KB 对齐的
  # libmpv 1.1.7，配合 compileSdk 36 / AGP 8.13 满足 Android 15+ 16KB 页要求。
  # better_player：ExoPlayer(Media3) 内核，腾讯/阿里播放器同款。
  # 换它的原因（实测）：libmpv 的 HLS 解复用要自己维护列表重写，
  # 一旦漏掉 #EXT-X-ENDLIST 就被判成直播流（只播末尾几片）；
  # 分片 302 要手动跟；60 秒大分片没有 BYTERANGE 支持。
  # betterplayer 原生解决：DefaultHlsPlaylistParser 认 ENDLIST、
  # DefaultHttpDataSource 自带跨协议跳转、MediaCodec 自动硬解，
  # 并且内置画质选择 / 音轨选择 / 字幕 / PiP / 投屏。
  # 1.36.0 要求 Flutter >=3.47.0（本项目 3.47.9）。
  better_player: ^1.36.0
  web_socket_channel: '>=2.4.0 <3.0.0'
  shared_preferences: '>=2.2.2 <3.0.0'
  # 直播详情「分享」调系统分享面板；10.x 兼容 Flutter 3.32 / compileSdk 36。
  share_plus: '>=10.1.4 <11.0.0'
  image_picker: '>=1.1.2 <2.0.0'
  image: ^4.2.0
  path_provider: '>=2.1.4 <3.0.0'
  # 读取 Android 真实 versionName / versionCode（设置页、关于页、检查更新）。
  package_info_plus: '>=10.1.0 <11.0.0'
  # 播放页上下滑手势：亮度 / 音量。两者都是 media_kit_video 的传递依赖，
  # 显式声明以便与 media_kit_video 锁在同一大版本，避免解析出不兼容的新版。
  screen_brightness_platform_interface: ^2.1.2
  volume_controller: '>=3.4.4 <4.0.0'
  # DLNA/UPnP 投屏：SSDP 发现 + AVTransport / RenderingControl SOAP。
  # 纯 Dart 实现，SDK >=3.8，与 Flutter 3.32.8 / Dart 3.8.1 匹配。
  dlna_dart: ^0.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash_logo.png

# dlna_dart 0.1.2 依赖 xml ^6.5.0，better_player 1.36 依赖 xml ^7.0.1。
# xml 7 的 API 对 6 是向后兼容的（parse/节点遍历/属性访问都保留），
# 这里把 dlna_dart 的 xml 约束放宽到 7，避免版本求解失败。
dependency_overrides:
  xml: ^7.0.1
