name: fantasy_tv
description: 幻想影视 - 纯净追剧
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  # PLAYER_CORE（2026-11-13）：播放内核换成 ExoPlayer（Android Media3）。
  #
  # 内核走 android_src/ 里自带的原生桥（ExoPlayerPlugin.kt + PlatformView），
  # 由 tools/patch_exoplayer.py 在 CI 构建时注入 Android 工程，不在 Dart 依赖里。
  # 控件仍然全部自绘，只是内核从 libmpv 换成 Android 原生 ExoPlayer。
  #
  # 为什么不用 media_kit/libmpv：demuxer-readahead-secs / cache-buffering-state
  # / cache-pause-wait 那套属性在大分片 4K 源上极难调好，反复出现
  # 「加载慢 / 出画黑屏 / 缓冲卡 99」。ExoPlayer 的 DefaultLoadControl
  # 按**时长**缓冲、自己调度分片，原生认 #EXT-X-ENDLIST，也能跟 302。
  #
  # 为什么不用 better_player / video_player：它们自带 widget 层和生命周期，
  # 会自己 dispose controller，跟我们「竖屏/全屏共用同一实例 + 内部救援链」
  # 的用法冲突。这里只要最小内核，控制权留在 FxPlayer 手里。
  web_socket_channel: '>=2.4.0 <3.0.0'
  shared_preferences: '>=2.2.2 <3.0.0'
  # 直播详情「分享」调系统分享面板；10.x 兼容 Flutter 3.32 / compileSdk 36。
  share_plus: '>=10.1.4 <11.0.0'
  image_picker: '>=1.1.2 <2.0.0'
  image: ^4.2.0
  path_provider: '>=2.1.4 <3.0.0'
  # DOWNLOAD_DIR（2026-11-14）：调用系统文件管理器选缓存目录
  file_picker: '>=8.1.2 <11.0.0'
  # 读取 Android 真实 versionName / versionCode（设置页、关于页、检查更新）。
  # 播放器顶栏电量显示
  battery_plus: ^7.1.2
  package_info_plus: '>=8.3.1 <9.0.0'
  # 播放页上下滑手势：亮度 / 音量。
  screen_brightness_platform_interface: ^2.1.2
  volume_controller: '>=3.4.4 <4.0.0'
  # DLNA/UPnP 投屏：SSDP 发现 + AVTransport / RenderingControl SOAP。
  # 纯 Dart 实现，SDK >=3.8，与 Flutter 3.32.8 / Dart 3.8.1 匹配。
  dlna_dart: ^0.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash_logo.png
