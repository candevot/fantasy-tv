name: fantasy_tv
description: 幻想影视 - 纯净追剧
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  # PLAYER_CORE（2026-11-14 二次切换）：内核回到定制 ExoPlayer(Media3)。
  #
  # media_kit 三件套（media_kit / media_kit_video / media_kit_libs_video）
  # 已从依赖里移除：ExoPlayer 内核完全走 Android 原生桥，Dart 侧不需要
  # libmpv。CI 门禁会校验这三项必须不存在（残留会让 APK 多带 4 个架构的
  # libmpv.so，25MB → 62MB，且 16KB 页对齐要额外兜）。
  # 内核源码：android_src/kotlin/.../ExoPlayerPlugin.kt + SegmentPreloader.kt，
  # 由 tools/patch_exoplayer.py 在构建时注入 Android 工程。
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  web_socket_channel: '>=2.4.0 <3.0.0'
  shared_preferences: '>=2.2.2 <3.0.0'
  # 直播详情「分享」调系统分享面板；10.x 兼容 Flutter 3.32 / compileSdk 36。
  share_plus: '>=10.1.4 <11.0.0'
  image_picker: '>=1.1.2 <2.0.0'
  image: ^4.2.0
  path_provider: '>=2.1.4 <3.0.0'
  # DOWNLOAD_DIR（2026-11-14）：调用系统文件管理器选缓存目录
  # 11.x：getDirectoryPath 已是静态方法；且它的 win32 ^5.9 不会和
  # share_plus 10.1.4 的 win32 ^5.5.3 冲突（13.x 要 win32 ^6，pub 解不出来）。
  # 读取 Android 真实 versionName / versionCode（设置页、关于页、检查更新）。
  # 播放器顶栏电量显示
  battery_plus: ^7.1.2
  package_info_plus: '>=8.3.1 <9.0.0'
  # 播放页上下滑手势：亮度 / 音量。
  # DLNA/UPnP 投屏：SSDP 发现 + AVTransport / RenderingControl SOAP。
  # 纯 Dart 实现，SDK >=3.8，与 Flutter 3.32.8 / Dart 3.8.1 匹配。
  dlna_dart: ^0.1.2
  # TVBox 加密配置（肥猫 `$#<key>#$` + AES-128-CBC）解密：纯 Dart 的 AES 实现，
  # 不碰 Android 原生也不加 JNI。这里只用 AESEngine / CBCBlockCipher，
  # 所以直接依赖 pointycastle 本体，不再套一层 encrypt 包装。
  pointycastle: ^3.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash_logo.png
