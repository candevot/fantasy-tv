name: fantasy_tv
description: 幻想影视 - 纯净追剧
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  # media_kit（libmpv）播放内核。回退原因见 commit：ExoPlayer 拿不到
  # cache-on-disk / demuxer-max-bytes 这类控制，播放体验做不到「秒播不卡」。
  # libs_video 1.0.7 起自带 16KB 对齐，满足 Play 的页对齐要求。
  media_kit: ^1.2.6
  media_kit_video: '>=1.3.1 <2.0.0'
  media_kit_libs_video: ^1.0.7

  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  # PLAYER_CORE（2026-11-13）：播放内核换成 ExoPlayer（Android Media3）。
  #
  # 内核走 android_src/ 里自带的原生桥（ExoPlayerPlugin.kt + PlatformView），
  # 由 tools/patch_exoplayer.py 在 CI 构建时注入 Android 工程，不在 Dart 依赖里。
  # 控件仍然全部自绘，只是内核从 libmpv 换成 Android 原生 ExoPlayer。
  #
  web_socket_channel: '>=2.4.0 <3.0.0'
  shared_preferences: '>=2.2.2 <3.0.0'
  # 直播详情「分享」调系统分享面板；10.x 兼容 Flutter 3.32 / compileSdk 36。
  share_plus: '>=10.1.4 <11.0.0'
  image_picker: '>=1.1.2 <2.0.0'
  image: ^4.2.0
  path_provider: '>=2.1.4 <3.0.0'
  # DOWNLOAD_DIR（2026-11-14）：调用系统文件管理器选缓存目录
  # 11.x：getDirectoryPath 已是静态方法；且它的 win32 ^5.9 不会和
  # share_plus 10.1.4 的 win32 ^5.5.3 冲突（13.x 要 win32 ^6，pub 解不出来）。
  file_picker: '>=11.0.3 <12.0.0'
  # 读取 Android 真实 versionName / versionCode（设置页、关于页、检查更新）。
  # 播放器顶栏电量显示
  battery_plus: ^7.1.2
  package_info_plus: '>=8.3.1 <9.0.0'
  # 播放页上下滑手势：亮度 / 音量。
  # DLNA/UPnP 投屏：SSDP 发现 + AVTransport / RenderingControl SOAP。
  # 纯 Dart 实现，SDK >=3.8，与 Flutter 3.32.8 / Dart 3.8.1 匹配。
  dlna_dart: ^0.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash_logo.png
